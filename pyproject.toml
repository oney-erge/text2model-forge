[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "text2model-forge"
version = "0.2.0rc1"
description = "Auditable, human-gated orchestration for local AI-assisted 3D assets."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_LICENSES.md"]
authors = [
  { name = "Oney Erge", email = "48371335+oney-erge@users.noreply.github.com" },
]
keywords = ["3d", "asset-pipeline", "blender", "comfyui", "human-in-the-loop", "provenance"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: GPU :: NVIDIA CUDA",
  "Framework :: Pydantic :: 2",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Graphics :: 3D Modeling",
]
dependencies = [
  "httpx>=0.27,<1",
  "networkx>=3,<4",
  "numpy>=1.26,<3",
  "Pillow>=12.3,<13",
  "pydantic>=2.8,<3",
  "trimesh>=4.4,<5",
]

[project.optional-dependencies]
local-ai = [
  # Required by resources/adapters/install_qwen_image_edit_models.py. Keep heavyweight
  # ComfyUI/PyTorch dependencies in ComfyUI's own isolated environment.
  "huggingface-hub>=0.27,<2",
]
dev = [
  "build>=1.3,<2",
  "pip-audit>=2.10,<3",
  "pytest>=9.0.3,<10",
  # Randomizes test order every run. Earned its place: it caught a real
  # order/timing-dependent race in the Studio web test fixture that a fixed
  # order never surfaced.
  "pytest-randomly>=3,<4",
  "pytest-cov>=5,<7",
]

[project.scripts]
text2model-forge = "text2model_forge.cli:main"
text2model-sprites = "text2model_forge.sprites.cli:main"

[project.urls]
Homepage = "https://github.com/oney-erge/text2model-forge"
Documentation = "https://github.com/oney-erge/text2model-forge#readme"
Issues = "https://github.com/oney-erge/text2model-forge/issues"
Source = "https://github.com/oney-erge/text2model-forge"

[tool.setuptools.packages.find]
where = ["src"]
include = ["text2model_forge*"]

[tool.setuptools.package-data]
text2model_forge = ["profiles/*.toml"]

# The live compiler invokes these files through typed subprocess contracts.
# Source checkouts use the repository copies; wheels install the identical
# tree under <environment>/share/text2model-forge, resolved by
# text2model_forge.paths.
[tool.setuptools.data-files]
"share/text2model-forge/adapters" = ["resources/adapters/*.py"]
"share/text2model-forge/blender" = ["resources/blender/*.py"]
"share/text2model-forge/workers" = ["resources/workers/*.json"]
"share/text2model-forge/registry" = ["resources/registry/*.json"]
"share/text2model-forge/motion_library" = ["resources/motion_library/*.example.json"]
"share/text2model-forge/presets" = ["resources/presets/*.json"]
"share/text2model-forge/assets" = ["resources/assets/*.json"]
"share/text2model-forge/configs" = ["resources/configs/*.json"]
"share/text2model-forge/characters" = ["resources/characters/*.json"]
"share/text2model-forge/creatures" = ["resources/creatures/*.json"]
"share/text2model-forge/creatures/families" = ["resources/creatures/families/*.json"]
"share/text2model-forge/genesis/families" = ["resources/genesis/families/*.json"]
"share/text2model-forge/golden" = ["resources/golden/*.json"]
"share/text2model-forge/qualifications" = ["resources/qualifications/*.json"]
"share/text2model-forge/environments" = ["resources/environments/*.txt"]
"share/text2model-forge/compat/diso" = ["resources/compat/diso/README.md"]
"share/text2model-forge/compat/diso/diso" = ["resources/compat/diso/diso/*.py"]
"share/text2model-forge/unity_smoke_template/Assets/Editor" = ["resources/unity_smoke_template/Assets/Editor/*.cs", "resources/unity_smoke_template/Assets/Editor/*.meta"]
"share/text2model-forge/unity_smoke_template/Packages" = ["resources/unity_smoke_template/Packages/*.json"]
"share/text2model-forge/unity_smoke_template/ProjectSettings" = ["resources/unity_smoke_template/ProjectSettings/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
