name: Release

on:
  push:
    tags: ["v*"]

permissions:
  actions: read
  artifact-metadata: write
  attestations: write
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Set deterministic build timestamp
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)" >> "$GITHUB_ENV"
      - name: Verify and build Python distributions
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python -m pip install --upgrade "pip==26.2.1" "setuptools==84.0.0"
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install --no-deps --no-build-isolation -e .
          python -c 'import os, re, tomllib; version=tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]; expected="v"+re.sub(r"rc(\d+)$", r"-rc.\1", version); tag=os.environ["RELEASE_TAG"]; assert tag == expected, f"tag {tag!r} must equal {expected!r}"'
          python -m pytest tests -q
          python -m text2model_forge demo --workspace "${RUNNER_TEMP}/release-demo" >/dev/null
          python -m build
      - name: Build versioned source archives and container image
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          prefix="text2model-forge-${RELEASE_TAG#v}"
          git archive --format=tar.gz --prefix="${prefix}/" --output="dist/${prefix}.tar.gz" HEAD
          git archive --format=zip --prefix="${prefix}/" --output="dist/${prefix}.zip" HEAD
          docker build --build-arg "TEXT2MODEL_FORGE_SOURCE_REVISION=${GITHUB_SHA}" --tag "text2model-forge:${RELEASE_TAG}" .
      - name: Generate source SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          artifact-name: text2model-forge-source.spdx.json
          output-file: dist/text2model-forge-source.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Generate container SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: text2model-forge:${{ github.ref_name }}
          artifact-name: text2model-forge-container.spdx.json
          output-file: dist/text2model-forge-container.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Write checksums
        run: |
          checksums="${RUNNER_TEMP}/TEXT2MODEL_FORGE_SHA256SUMS"
          cd dist
          find . -maxdepth 1 -type f -printf '%f\0' | sort -z | xargs -0 sha256sum > "$checksums"
          mv "$checksums" SHA256SUMS
      - name: Attest release files
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: text2model-forge-release-${{ github.ref_name }}
          path: dist/*
      - name: Create prerelease with checksums, SBOM, and distributions
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/* --verify-tag --generate-notes --prerelease
