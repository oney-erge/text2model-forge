name: CI

# Covers the half of the system that needs no GPU, Blender, ComfyUI, Ollama,
# WSL2, or Unity: the orchestration substrate, typed contracts, human gates,
# config resolution, and lineage. The generation workers themselves are
# manual-only by nature -- see the README's Known gaps.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is the primary development platform. Ubuntu and macOS prove
        # that path, atomic-write, launcher, and browser behavior is portable.
        os: [windows-latest, ubuntu-latest, macos-latest]
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade "pip==26.2.1" "setuptools==84.0.0"
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install --no-deps --no-build-isolation -e .

      # pytest-randomly shuffles order every run; a seed is printed on
      # failure so a bad ordering can be reproduced with -p randomly --seed=N.
      - name: Test
        run: python -m pytest tests -q --cov=text2model_forge --cov-report=term

      - name: Deterministic D0-D10 orchestration fixture
        run: python -m text2model_forge demo --workspace ${{ runner.temp }}/forge-demo

      - name: Resolved configuration is loadable for every shipped profile
        run: |
          python -m text2model_forge config show --profile base
          python -m text2model_forge config show --profile simple
          python -m text2model_forge config show --profile advanced
          python -m text2model_forge config show --profile 8gb

      - name: Native launcher parses
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            # PowerShell must receive literal dollar signs.
            # shellcheck disable=SC2016
            pwsh -NoProfile -Command '$errors = $null; [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path ./run.ps1), [ref]$null, [ref]$errors); if ($errors.Count) { $errors | Format-List | Out-String | Write-Error }'
            # shellcheck disable=SC2016
            pwsh -NoProfile -Command '$errors = $null; [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path ./text2model-forge.ps1), [ref]$null, [ref]$errors); if ($errors.Count) { $errors | Format-List | Out-String | Write-Error }'
          else
            bash -n ./run.sh ./run.command ./text2model-forge.sh
            if command -v shellcheck >/dev/null 2>&1; then
              shellcheck --severity=error ./run.sh ./run.command
            else
              echo "::notice::shellcheck is unavailable on ${RUNNER_OS}; bash syntax checks passed."
            fi
          fi

      - name: Native core launcher installs from its lock and runs its smoke test
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            pwsh -NoProfile -File ./text2model-forge.ps1 -Action install -AiStack core -IncludeDev -NonInteractive -NoElevation -NoBrowser -MaxAttempts 1
          else
            bash ./text2model-forge.sh install --ai-stack core --include-dev --non-interactive --no-elevation --no-browser --max-attempts 1
          fi

  browser-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install development environment
        run: |
          python -m pip install --upgrade "pip==26.2.1" "setuptools==84.0.0"
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Responsive browser flow
        run: python -m pytest tests/test_studio_browser.py -q

  coupling:
    # Guards the extraction: this package must not grow a dependency back on
    # any specific consuming project, and must not regain the repo-root
    # assumptions that broke when it was lifted out of the game repo.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: No dependency on a specific consuming project
        run: |
          if git grep -In -i -E 'ember[[:space:]_-]*defense' -- \
              '*.py' '*.toml' '*.json' '*.md' \
              ':(exclude)AGENTS.md' ':(exclude)CLAUDE.md' ':(exclude)tests/**'; then
            echo "::error::Found a reference to a specific consuming project outside the guard test."
            exit 1
          fi

      - name: Lint GitHub Actions workflows
        run: |
          docker run --rm --volume "$PWD:/repo" --workdir /repo \
            rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Build wheel
        run: |
          python -m pip install --upgrade "pip==26.2.1" "setuptools==84.0.0"
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install --no-deps --no-build-isolation -e .
          python -m build
      - name: Verify clean wheel installation and bundled resources
        run: |
          python -m venv "${RUNNER_TEMP}/wheel-check"
          "${RUNNER_TEMP}/wheel-check/bin/python" -m pip install --upgrade "pip==26.2.1"
          "${RUNNER_TEMP}/wheel-check/bin/python" -m pip install --require-hashes -r requirements.lock
          "${RUNNER_TEMP}/wheel-check/bin/python" -m pip install --no-deps dist/*.whl
          cd "${RUNNER_TEMP}"
          "${RUNNER_TEMP}/wheel-check/bin/text2model-forge" config show --profile simple --values-only >/dev/null
          "${RUNNER_TEMP}/wheel-check/bin/text2model-forge" workers > workers.json
          "${RUNNER_TEMP}/wheel-check/bin/python" -c 'import json; assert len(json.load(open("workers.json", encoding="utf-8"))) == 13'
          "${RUNNER_TEMP}/wheel-check/bin/text2model-forge" demo --workspace "${RUNNER_TEMP}/wheel-demo" >/dev/null
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: text2model-forge-python-distributions
          path: dist/*

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate Compose model
        run: docker compose config --quiet
      - name: Build the non-root Studio image
        run: docker build --build-arg "TEXT2MODEL_FORGE_SOURCE_REVISION=${GITHUB_SHA}" --tag text2model-forge:ci .

      - name: No stale repo-root path assumptions
        run: |
          if grep -rn "parents\[3\]\|tools/text2model_forge" --include="*.py" src/text2model_forge/ resources/adapters/; then
            echo "::error::Found a pre-extraction path assumption."
            exit 1
          fi
